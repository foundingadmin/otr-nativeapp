name: Rebuild Token Outputs

on:
  push:
    branches:
      - main
    paths:
      - 'brand/**'
      - 'sweden/engine/**'

permissions:
  contents: write

jobs:
  rebuild:
    name: Run adapters → commit output
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run all enabled adapters
        run: node sweden/engine/run-adapters.js

      - name: Commit adapter output (if changed)
        run: |
          git config user.name  "sweden-bot"
          git config user.email "sweden-bot@users.noreply.github.com"
          git add brand/tokens/output/ showcase/public/colors_and_type.css

          if git diff --cached --quiet; then
            echo "No adapter output changed — nothing to commit."
          else
            git commit -m "chore(adapters): rebuild output [skip ci]"
            git push
          fi
