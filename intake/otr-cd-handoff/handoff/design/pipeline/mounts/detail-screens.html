<style>
  html, body { margin:0; padding:0; height:100%; background:#f0eee9; }
  #root { height:100vh; }
  /* 64px breathing room inside every artboard frame; inner mobile content
     stays fixed (content-box so the padding adds around the 390px screen) */
  .dc-card { box-sizing:content-box !important; padding:64px !important; }
  a { color: var(--otr-blue, #2e6bff); text-decoration: none; }
  a:hover { color: oklch(0.55 0.18 255); }
  /* WIP explore pins: hidden on this page for now (kept in the exploration files) */
  .explore-pin{ display:none !important; }
  .explore-pin-off{ position:absolute; z-index:6; display:inline-flex; align-items:center; gap:6px;
    font-family:'Figtree',var(--font-sans),sans-serif; font-size:10.5px; font-weight:800; letter-spacing:.02em;
    color:#fff; background:rgba(46,107,255,.94); border:1px solid rgba(255,255,255,.28);
    padding:6px 10px; border-radius:999px; text-decoration:none; box-shadow:0 4px 12px rgba(20,30,60,.26);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); cursor:pointer; white-space:nowrap; }
  .explore-pin:hover{ background:rgba(30,82,204,.98); color:#fff; }
  .thero .explore-pin{ top:46px; left:50%; transform:translateX(-50%); }
  .rtabs-zone{ position:relative; }
  .rtabs-zone .explore-pin{ top:7px; right:12px; }
  .zone-ph{ position:relative; margin:18px 14px 4px; border:1.5px dashed var(--wf-line); border-radius:16px;
    background:#fbfcff; padding:26px 16px 20px; display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; }
  .zone-ph .zph-t{ font-size:13px; font-weight:800; color:var(--wf-muted); }
  .zone-ph .zph-s{ font-size:11.5px; color:var(--wf-faint); max-width:250px; line-height:1.45; }
  .zone-ph .explore-pin{ top:10px; right:10px; }
</style>
