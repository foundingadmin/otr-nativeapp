<style>
  html, body { margin: 0; padding: 0; background: var(--surface-subtle); }
  body { font-family: var(--font-sans, 'Figtree', sans-serif); color: var(--text-primary); }
  a { color: var(--text-link); text-decoration: none; }
  a:hover { color: var(--blue-800); text-decoration: underline; }
  .page { max-width: 1080px; margin: 0 auto; padding: 56px 24px 96px; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 16px; }
  h1 { font-size: 44px; font-weight: 800; letter-spacing: 0; margin: 0 0 20px; color: var(--text-primary); }
  .intro { font-size: 17px; line-height: 1.55; color: var(--text-secondary); max-width: 640px; margin: 0 0 16px; text-wrap: pretty; }
  .stats { font-size: 14px; color: var(--text-tertiary); margin: 0 0 32px; }
  .stats strong { color: var(--text-primary); }
  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip { font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: 0.01em; color: var(--text-secondary);
          background: var(--white); border: 1px solid var(--border-primary); border-radius: 999px; padding: 7px 14px; cursor: pointer;
          transition: background 140ms ease, border-color 140ms ease; display: inline-flex; align-items: center; gap: 6px; }
  .chip:hover { background: var(--neutral-50); }
  .chip.active { background: var(--blue-600); border-color: var(--blue-600); color: var(--white); }
  .chip-n { font-size: 12px; font-weight: 700; opacity: 0.7; }
  .age { font-size: 12px; font-weight: 600; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .jump { font-size: 11px; color: var(--neutral-300); line-height: 1; padding: 2px; }
  .jump:hover { color: var(--text-link); text-decoration: none; }
  .tree { padding-top: 12px; border-top: 1px solid var(--border-secondary); }
  .nav-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px 10px 16px; border-radius: 12px; }
  .nav-row.folder { cursor: pointer; }
  .nav-row:hover { background: rgba(21, 94, 239, 0.05); }
  .band { border-radius: 16px; padding: 4px 2px; }
  .band-alt { background: var(--white); }
  .nav-row.zeb { background: rgba(16, 24, 40, 0.028); }
  .chev { width: 16px; flex: 0 0 16px; margin-top: 3px; color: var(--neutral-400); font-size: 12px; text-align: center; }
  .leaf-dot { display: inline-block; width: 6px; height: 6px; border-radius: 999px; background: var(--neutral-200); vertical-align: 2px; }
  .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .row-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15.5px; font-weight: 700; letter-spacing: 0.01em; }
  .fname { color: var(--text-primary); }
  .lname { color: var(--text-primary); font-weight: 600; }
  .row-note { font-size: 14px; line-height: 1.5; color: var(--text-tertiary); letter-spacing: 0.01em; max-width: 760px; text-wrap: pretty; }
  .count { flex: 0 0 auto; font-size: 12px; font-weight: 700; color: var(--text-tertiary); background: var(--neutral-50);
           border: 1px solid var(--border-secondary); border-radius: 999px; min-width: 26px; height: 22px; display: inline-flex;
           align-items: center; justify-content: center; padding: 0 8px; margin-top: 2px; }
  .kids { border-left: 1px solid var(--border-secondary); margin-left: 23px; }
  .kids .nav-row { margin-left: -24px; }
  .empty { padding: 40px 16px; color: var(--text-tertiary); font-size: 15px; }
  @media (prefers-reduced-motion: reduce) { .chip { transition: none; } }
</style>
