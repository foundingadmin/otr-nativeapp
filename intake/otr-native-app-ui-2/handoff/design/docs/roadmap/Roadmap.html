              box-shadow: var(--shadow-card, 0 1px 2px rgba(16,24,40,0.05)); overflow: hidden; }

  thead th { text-align: left; font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;

  tbody td { padding: 18px; border-bottom: 1px solid var(--border-secondary); vertical-align: top;

  tbody tr:last-child td { border-bottom: none; }
  .num { font-size: 13px; font-weight: 700; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

  .phase { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700;

  .phase .dot { width: 7px; height: 7px; border-radius: 999px; }
  .phase.done { background: var(--green-50, #ECFDF3); color: var(--green-700, #087443); border: 1px solid var(--green-200, #ABEFC6); }
  .phase.done .dot { background: var(--green-500, #17B26A); }
  .phase.current { background: var(--blue-50); color: var(--blue-700); border: 1px solid var(--blue-100); }
  .phase.current .dot { background: var(--blue-500); }
  .phase.next { background: var(--neutral-50); color: var(--text-tertiary); border: 1px solid var(--border-secondary); }
  .phase.next .dot { background: var(--neutral-300); }
  .foot { margin-top: 24px; font-size: 14px; color: var(--text-tertiary); }

<script type="text/babel" data-presets="react">
;(function () {
  // Canonical truth: ROADMAP.md: this is the high-level render. Detail lives in
  // workstream LEDGERs; action lives in the Review Hub.
  const ROWS = [
    { init: 'Case status system', phase: 'done', prd: { label: 'Cases Tab PRD', href: '../../cases/_docs-cases/Cases Tab PRD.md' },
      scope: 'The shared language every surface inherits: the badge registry, weight + form rules, and the SmartMatch\u2019d pattern. Remaining edge coverage rides inside this item.' },
    { init: 'Cases feed', phase: 'current', prd: { label: 'Cases Tab PRD', href: '../../cases/_docs-cases/Cases Tab PRD.md' },
      scope: 'The Cases tab: the feed of Case Preview Cards, its header, density, and actions.' },
    { init: 'Case detail page', phase: 'current', prd: { label: 'Cases Tab PRD', href: '../../cases/_docs-cases/Cases Tab PRD.md' },
      scope: 'The full record for a single case: structure, tabs, zones, and required actions (incl. LOE).' },
    { init: 'Homescreen', phase: 'next', prd: null,
      scope: 'Inherits the case status system. Cases leads; homescreen follows.' },
    { init: 'Onboarding', phase: 'next', prd: null,
      scope: 'The first-run experience.' },
    { init: 'Booking & instant quote', phase: 'next', prd: null,
      scope: 'The purchase flow surfaces, on the app-redesign line.' },
    { init: 'Communications layer', phase: 'next', prd: null,
      scope: 'Lifecycle comms and attorney messaging depth.' },
  ];

  const LABEL = { done: 'Done', current: 'Current', next: 'PRD' };

  function App() {
    return (
      <div className="page" data-screen-label="Roadmap">
        <div className="eyebrow">Off The Record · Native App UI</div>
        <h1>Roadmap</h1>
        <p className="intro">
          The whole redesign at a glance: what's done, what's being designed now, and what still
          needs a PRD written before it can move into Current.
          Ready to weigh in? The <a href="../review-hub/Review Hub.html">Review Hub</a> is where decisions happen.
        </p>

        <div className="tbl-wrap">
          <table>
            <colgroup>
              <col className="c-num" /><col className="c-init" /><col className="c-scope" /><col className="c-prd" /><col className="c-phase" />
            </colgroup>
            <thead>
              <tr><th>#</th><th>Initiative</th><th>Scope</th><th>PRD</th><th>Phase</th></tr>
            </thead>
            <tbody>
              {ROWS.map((r, i) => (
                <tr key={i}>
                  <td className="num">{String(i + 1).padStart(2, '0')}</td>
                  <td><span className="init">{r.init}</span></td>
                  <td><span className="scope">{r.scope}</span></td>
                  <td>{r.prd ? <a className="prd-link" href={r.prd.href}>{r.prd.label}</a> : <span className="none">·</span>}</td>
                  <td><span className={'phase ' + r.phase}><span className="dot"></span>{LABEL[r.phase]}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <p className="foot">
          Canonical truth: <strong>ROADMAP.md</strong> · <a href="../../File Navigator.html">File Navigator</a>
        </p>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
